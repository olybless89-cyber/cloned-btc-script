<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — Auralis Demo</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="demo-banner"><strong>DEMO ONLY</strong> — simulated data, no real trading.</div>

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/"><span class="mark">A</span> Auralis <span class="tag">Demo</span></a>
      <div class="nav-actions">
        <a class="btn btn-ghost" href="/login">Sign in</a>
      </div>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card wide">
      <h2>Create your demo account</h2>
      <p class="muted" style="font-size:15px">
        You'll start with <strong>$10,000</strong> in virtual cash. No card, no deposit, no verification.
      </p>

      <div class="alert error" id="alert"></div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" placeholder="Ada Lovelace" />
          <div class="err" data-err="fullName"></div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" placeholder="ada_l" />
            <div class="err" data-err="username"></div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" placeholder="ada@example.com" />
            <div class="err" data-err="email"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="At least 8 characters" />
            <div class="err" data-err="password"></div>
          </div>
          <div class="field">
            <label for="password2">Confirm password</label>
            <input id="password2" name="password2" type="password" placeholder="Repeat password" />
            <div class="err" data-err="password2"></div>
          </div>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="agree" />
          <span>I understand this is a demonstration app with simulated data and no real money.</span>
        </label>
        <button class="btn btn-primary btn-block" type="submit" id="submit">Create demo account</button>
      </form>

      <p class="muted" style="font-size:14px;margin-top:18px;text-align:center">
        Already registered? <a href="/login" style="color:var(--cyan)">Sign in</a>
      </p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const form = document.getElementById('signup-form');
    const alertBox = document.getElementById('alert');
    const submit = document.getElementById('submit');

    function clearErrors() {
      document.querySelectorAll('.err').forEach((el) => (el.textContent = ''));
      alertBox.classList.remove('show');
    }

    function showErrors(errors) {
      for (const [key, msg] of Object.entries(errors)) {
        const el = document.querySelector(`[data-err="${key}"]`);
        if (el) el.textContent = msg;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const values = {
        fullName: form.fullName.value.trim(),
        username: form.username.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
      };
      const password2 = form.password2.value;

      let local = {};
      if (!values.fullName) local.fullName = 'Please enter your name.';
      if (!values.username) local.username = 'Choose a username.';
      if (!values.email) local.email = 'Enter your email.';
      if (values.password.length < 8) local.password = 'Use at least 8 characters.';
      if (password2 !== values.password) local.password2 = 'Passwords do not match.';
      if (!document.getElementById('agree').checked) {
        alertBox.textContent = 'Please acknowledge that this is a demo.';
        alertBox.classList.add('show');
        return;
      }
      if (Object.keys(local).length) return showErrors(local);

      submit.disabled = true;
      submit.textContent = 'Creating…';
      const { ok, data } = await api.post('/api/auth/signup', values);
      submit.disabled = false;
      submit.textContent = 'Create demo account';

      if (!ok) {
        if (data.errors) showErrors(data.errors);
        else {
          alertBox.textContent = data.error || 'Could not create the account.';
          alertBox.classList.add('show');
        }
        return;
      }
      window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
